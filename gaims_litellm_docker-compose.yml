version: '3.9'

services:
  # PostgreSQL Database voor LiteLLM
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiteLLM Proxy Server (GEEN config.yaml nodig!)
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:main-stable
    container_name: litellm-proxy
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT}:4000"
    environment:
      # Database configuratie
      DATABASE_URL: postgresql://litellm:${DB_PASSWORD}@litellm-db:5432/litellm
      DATABASE_CONNECTION_POOL_LIMIT: ${DB_POOL_LIMIT}
      DATABASE_CONNECTION_TIMEOUT: ${DB_TIMEOUT}
      STORE_MODEL_IN_DB: True
      # LiteLLM Authenticatie
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      
      # UI Login
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      
      # Logging
      LITELLM_LOG: ${LITELLM_LOG_LEVEL}
      
    networks:
      - litellm-network
    command: 
      - "--port"
      - "4000"
      - "--num_workers"
      - "${NUM_WORKERS}"
      - "--drop_params"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  litellm-db-data:
    driver: local

networks:
  litellm-network:
    driver: bridge
